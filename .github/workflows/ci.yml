name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-ci:
    # pinned to feature/ci-pipeline-templates branch tip; re-pin to a main-branch SHA once software-factory's stacked PRs merge (squash merge means this SHA never lands on main)
    uses: ameetmadan/software-factory/.github/workflows/ci-node.yml@9cd48e03644ea5c24b3fd4961bc5dab20981bd56
    with:
      working-directory: frontend

  backend-ci:
    # pinned to feature/ci-pipeline-templates branch tip; re-pin to a main-branch SHA once software-factory's stacked PRs merge (squash merge means this SHA never lands on main)
    uses: ameetmadan/software-factory/.github/workflows/ci-node.yml@9cd48e03644ea5c24b3fd4961bc5dab20981bd56
    with:
      working-directory: backend
